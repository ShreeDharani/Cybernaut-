<html>
<head>
    <title>IMDb Top 250 Movies</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: #ffcc00;
            font-weight: bold;
            text-align: center;
        }
        .table {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }
        .table thead {
            background-color: #2c2c2c;
            color: #ffcc00;
        }
        .table tbody tr:hover {
            background-color: #2a2a2a;
            transition: 0.3s;
        }
        .search-bar {
            margin-bottom: 20px;
        }
        .highlight {
            background-color: #333333 !important;
            color: #ffcc00;
            font-weight: bold;
        }
        .rating-stars {
            color: #ffcc00;
        }
    </style>
</head>
<body class="container mt-4">
    <h1 class="mb-4">🎬 IMDb Top 250 Movies</h1>

    <!-- Search bar -->
    <input class="form-control search-bar" id="searchInput" type="text" placeholder="🔍 Search movies...">

    <!-- Table -->
    <table class="table table-dark table-hover">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Title</th>
                <th>Year</th>
                <th>Rating</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr class="{% if row['Rank'] <= 10 %}highlight{% endif %}">
                <td>{{ row['Rank'] }}</td>
                <td>{{ row['Title'] }}</td>
                <td>{{ row['Year'] }}</td>
                <td>
                    {{ row['Rating'] }}
                    <span class="rating-stars">
                        {% for i in range(row['Rating']|int) %}
                            ★
                        {% endfor %}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Scripts -->
    <script>
        // 🔍 Search filter
        document.getElementById("searchInput").addEventListener("keyup", function() {
            let filter = this.value.toLowerCase();
            let rows = document.querySelectorAll("tbody tr");
            rows.forEach(row => {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        });

        // ↕️ Sort columns by clicking headers
        document.querySelectorAll("th").forEach((header, index) => {
            header.addEventListener("click", () => {
                let rows = Array.from(document.querySelector("tbody").rows);
                rows.sort((a, b) => {
                    let valA = a.cells[index].innerText;
                    let valB = b.cells[index].innerText;
                    return valA.localeCompare(valB, undefined, {numeric: true});
                });
                rows.forEach(row => document.querySelector("tbody").appendChild(row));
            });
        });
    </script>
</body>
</html>
